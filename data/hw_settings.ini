#Mikes KB2ML sBitx DE hardware board settings
#running under maxibitx control
#calculated to produce ~5 watts out on all bands

# offset from xtal filter center for image suppression
bfo_freq=40035000
# true center of crystal filter
xtal_filter_center=40012400

# TX power, in watts. full_scale_power is this board's rated output -
# what a full-scale signal makes once the [tx_band] scales below are
# calibrated. max_power is the ceiling the ALC limiter holds. Equal
# values are the normal setting: the radio makes rated power and the
# limiter holds it there, pulling back anything the mic gain or a host's
# audio level pushes past it. Set max_power lower only to run below
# rated power. Both keys must stay above the [tcxo] line - they are
# top-level, not part of a section.
full_scale_power=5
max_power=5

# si5351 reference frequency as measured on this board
[tcxo]
cal=25000000

#80 meters
# calibrated 2026-09: 5.5W @ 3.560 MHz
[tx_band]
f_start=3500000
f_stop=4000000
scale=0.000850

#60 meters
# calibrated 2026-09: 5.5W @ ~5.357 MHz
[tx_band]
f_start=5250000
f_stop=5450000
scale=0.00109

#40 meters
# calibrated 2026-09: 5.6W @ 7.030 MHz
