# Mikes KB2ML hardware board settings for zBitx V1
# (on loan from Evan Hand, AC9TU)
# running under maxibitx control
# NOTE: The file format here is the same for zbitx and sbitx.
# but identifying the correct radio hardware in use is critical!
# The 'scale' values used for each band will be very different
# between zbitx and sbitx

# identify the radio hardware in use
# for sbitx DE, V2 and V3
#sbitx_version = SBITX_V3
# for zbitx V1 and V2
sbitx_version = SBITX_V4

# offset from xtal filter center for image suppression on TX
# to put one mixer product well above xtal filter skirt
bfo_freq=40048000
# true center of crystal filter, spec is 40012400
xtal_filter_center=40012400

# TX power, in watts. full_scale_power is what a full-scale signal makes
# once the [tx_band] scales below are calibrated; max_power is the ALC
# limiter's ceiling. Both are 2 W here: a deliberately conservative
# starting point, calibrated on a borrowed board. These scales gave 2.0 to
# 2.6 W at full scale before the last trim, so there is headroom; to run
# higher, raise both values together and re-check each band on a
# wattmeter (docs/dsp_design_notes/zbitx_port_study.md section 12).
full_scale_power=2
max_power=2

# Milliseconds (0 - 100) EXT_PTT is held before TX_LINE, for an external
# amplifier. The zBitx has no EXT_PTT, so maxibitx ignores this here.
ext_ptt_delay_ms=0

# NOTE - Section headings are in square brackets [ ] below
# A section heading 'owns' all the settings below it, until another
# section heading or end of file

[tcxo]
#si5351 reference frequency as measured on this board
cal=25000000

# Per-band scales: full scale = 2 W, measured into a dummy load in CW with
# TUNE, at full_scale_power = max_power = 2.

#80 meters
# calibrated 2026-10-12: 2.1W @ 3.560 MHz
[tx_band]
f_start=3500000
f_stop=4000000
scale=0.00314

#60 meters
# calibrated 2026-10-12: 2.1W @ ~5.357 MHz
[tx_band]
f_start=5250000
f_stop=5450000
scale=0.00309

#40 meters
# calibrated 2026-10-12: 2.0W @ 7.030 MHz
[tx_band]
f_start=7000000
f_stop=7300000
scale=0.00338

#30 meters
# calibrated 2026-10-12: 1.9W @ 10.106 MHz
[tx_band]
f_start=10000000
f_stop=10200000
scale=0.00337

#20 meters
# calibrated 2026-10-12: 1.9W @ 14.060 MHz
[tx_band]
f_start=14000000
f_stop=14350000
scale=0.00506

#17 meters
# calibrated 2026-10-12: 2.1W @ 18.086 MHz
[tx_band]
f_start=18000000
f_stop=18200000
scale=0.00476

#15 meters
# calibrated 2026-10-12: 2.1W @ 21.060 MHz
