# Mikes KB2ML hardware board settings for zBitx V1
# (on loan from Evan Hand, AC9TU)
# running under maxibitx control
# NOTE: The file format here is the same for zbitx and sbitx.
# but identifying the correct radio hardware in use is critical!
# The 'scale' values used for each band will be very different
# between zbitx and sbitx, and have changed from older versions of
# software

# identify the radio hardware in use
# for sbitx DE, V2 and V3
#sbitx_version = SBITX_V3
# for zbitx V1 and V2
sbitx_version = SBITX_V4

# TX power, in watts. full_scale_power is the board's maximum output
# measured during calibration.  max_power is the chosen ALC limiter limit
full_scale_power=2
max_power=2

# milliseconds (0 - 100) EXT_PTT is held before TX_LINE, so an external amplifier's
# relay has closed before RF appears. 20 is the safe default; set 0 only if
# nothing is connected to EXT_PTT. 
ext_ptt_delay_ms=0

# milliseconds a key contact's bounce is ignored after it changes (0-20)
key_debounce_ms=3

# TCP port TCI clients connect to (0 turns TCI off)
tci_port=50001
# number of clients that can connect (each gets its own copy of data stream)
tci_max_clients=4
# which network (wired, Wi-Fi or localhost). leave blank for all networks
tci_bind=

############################################################
# Board settings, change only if re-calibrating
############################################################
#si5351 reference frequency as measured on this board
cal=25000000
# true center of crystal filter, spec is 40012400
xtal_filter_center=40012400
# offset from xtal filter center for image suppression on TX
# to put one mixer product well above xtal filter skirt
bfo_freq=40048000

#80 meters
# calibrated 2026-10-12: 2.1W @ 3.560 MHz
[tx_band]
f_start=3500000
f_stop=4000000
scale=0.00314

